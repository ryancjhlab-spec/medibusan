<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CI·BI 로고 최소 크기 규정 안내">
  <title>CI·BI 로고 제 | 최소 크기 규정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <main class="brand-guide">
    <header class="section-header">
      <div class="section-heading">
        <span class="section-number">04</span>
        <h1>최소 크기 규정</h1>
        <span class="section-english">MINIMUM SIZE</span>
      </div>
      <img class="header-line" src="assets/figma/line-top.svg" alt="">
    </header>

    <section class="size-panel" aria-labelledby="size-title">
      <h2 id="size-title" class="sr-only">매체별 로고 최소 크기</h2>
      <div class="size-row">
        <div class="size-description">
          <strong>디지털 (Digital)</strong>
          <span>Min H: 24px</span>
        </div>
        <div class="vertical-line" aria-hidden="true"></div>
        <div class="logo-scale digital-scale">
          <img src="assets/figma/logo-small.png" alt="CI 로고" class="logo-digital">
          <span>24px 실제 크기</span>
        </div>
      </div>

      <img class="panel-line" src="assets/figma/line-divider.svg" alt="">

      <div class="size-row">
        <div class="size-description">
          <strong>인쇄 (Print)</strong>
          <span>Min H: 10mm</span>
        </div>
        <div class="vertical-line" aria-hidden="true"></div>
        <div class="logo-scale print-scale">
          <img src="assets/figma/logo-print.png" alt="CI 로고" class="logo-print">
          <span>10mm 권장 최소 크기</span>
        </div>
      </div>
    </section>

    <p class="guide-note">제작물의 해상도 및 매체 조건에 따라 심볼마크가 뭉개져 보이는 현상을 방지하기 위해 각 출력 매체별로 정의된 최저 한계 스케일 규정을 필히 준수하십시오.</p>
  </main>
</body>
</html>
